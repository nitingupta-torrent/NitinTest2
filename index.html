<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="theme-color"
      content="#041533">

<title>Rivaan's Birthday Countdown</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    background-color: #041533;
}

body {
    min-height: 100vh;

    background-image:
        url("rivaan_birthday_background.png");

    background-size:
        contain;

    background-position:
        center top;

    background-repeat:
        no-repeat;

    overflow-x:
        hidden;

    color:
        white;
}


/* Main countdown area */

.countdown-container {

    width:
        min(92%, 900px);

    margin:
        0 auto;

    padding-top:
        35vh;

    padding-bottom:
        40px;

    text-align:
        center;
}


/* Timer */

.timer {

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        12px;
}


/* Timer boxes */

.box {

    background:
        rgba(2, 12, 45, 0.78);

    border:
        2px solid #52eaff;

    border-radius:
        18px;

    padding:
        16px 8px;

    box-shadow:
        0 0 12px #00d8ff,
        0 0 25px rgba(0, 102, 255, .55),
        inset 0 0 18px rgba(41, 109, 255, .22);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);
}


/* Countdown numbers */

.number {

    color:
        white;

    font-size:
        clamp(36px, 7vw, 82px);

    font-weight:
        1000;

    line-height:
        1;

    text-shadow:
        0 0 7px #00ddff,
        0 0 18px #126cff,
        3px 3px 0 #111950;
}


/* Labels */

.label {

    margin-top:
        7px;

    color:
        #c6f8ff;

    font-size:
        clamp(10px, 1.5vw, 17px);

    font-weight:
        900;

    letter-spacing:
        .1em;
}


/* Message */

.message {

    display:
        inline-block;

    margin-top:
        16px;

    padding:
        10px 20px;

    border-radius:
        30px;

    color:
        white;

    background:
        rgba(3, 16, 55, .82);

    border:
        2px solid #55edff;

    font-size:
        clamp(15px, 2.3vw, 25px);

    font-weight:
        900;

    box-shadow:
        0 0 16px rgba(0, 218, 255, .5);

    text-shadow:
        0 0 10px #00cfff;
}


/* Button */

button {

    margin-top:
        14px;

    border:
        none;

    border-radius:
        14px;

    padding:
        12px 18px;

    font-size:
        clamp(14px, 2vw, 18px);

    font-weight:
        1000;

    color:
        #08204a;

    background:
        linear-gradient(
            #fff66a,
            #ffb600
        );

    box-shadow:
        0 5px 0 #9a5200,
        0 0 18px rgba(255, 195, 0, .7);

    cursor:
        pointer;
}


button:active {

    transform:
        translateY(3px);

    box-shadow:
        0 2px 0 #9a5200,
        0 0 12px rgba(255, 195, 0, .6);
}


/* Power-up text */

#power {

    min-height:
        28px;

    margin-top:
        10px;

    color:
        #fff566;

    font-size:
        clamp(15px, 2vw, 22px);

    font-weight:
        1000;

    text-shadow:
        0 0 10px #ffb700;
}


/* Confetti */

.confetti {

    position:
        fixed;

    inset:
        0;

    pointer-events:
        none;

    overflow:
        hidden;

    z-index:
        999;
}


.piece {

    position:
        absolute;

    top:
        -40px;

    font-size:
        25px;

    animation:
        fall 2.6s linear forwards;
}


@keyframes fall {

    to {

        transform:
            translateY(115vh)
            rotate(720deg);

        opacity:
            .9;
    }
}


/* iPad / tablets */

@media (max-width: 900px) {

    .countdown-container {

        width:
            90%;

        padding-top:
            36vh;
    }

    .timer {

        gap:
            8px;
    }

    .box {

        padding:
            12px 5px;
    }

}


/* Phones */

@media (max-width: 600px) {

    body {

        background-size:
            100% auto;

        background-position:
            center top;
    }

    .countdown-container {

        width:
            92%;

        padding-top:
            31vh;
    }

    .timer {

        grid-template-columns:
            repeat(2, 1fr);

        gap:
            8px;
    }

    .box {

        padding:
            10px 5px;

        border-radius:
            14px;
    }

    .number {

        font-size:
            clamp(34px, 12vw, 58px);
    }

    .label {

        font-size:
            11px;
    }

    .message {

        margin-top:
            12px;

        padding:
            8px 14px;

        font-size:
            14px;
    }

    button {

        margin-top:
            10px;

        padding:
            10px 14px;

        font-size:
            14px;
    }

}


/* Very small phones */

@media (max-width: 390px) {

    .countdown-container {

        padding-top:
            29vh;
    }

    .timer {

        gap:
            6px;
    }

    .number {

        font-size:
            38px;
    }

    .label {

        font-size:
            10px;
    }

}

</style>

</head>

<body>


<div class="countdown-container">


    <div class="timer">


        <div class="box">

            <div
                class="number"
                id="days">
                00
            </div>

            <div class="label">
                DAYS
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="hours">
                00
            </div>

            <div class="label">
                HOURS
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="minutes">
                00
            </div>

            <div class="label">
                MINUTES
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="seconds">
                00
            </div>

            <div class="label">
                SECONDS
            </div>

        </div>


    </div>


    <div
        class="message"
        id="message">

        Loading birthday mission...

    </div>


    <br>


    <button
        id="powerButton"
        type="button">

        PRESS FOR POWER-UP ⚡

    </button>


    <div id="power"></div>


</div>


<div
    class="confetti"
    id="confetti">
</div>



<script>


const target =
    new Date(
        "2026-08-22T00:00:00-04:00"
    );


function pad(value) {

    return String(value)
        .padStart(2, "0");
}



function updateCountdown() {


    const now =
        new Date();


    const difference =
        target.getTime()
        -
        now.getTime();


    const daysElement =
        document.getElementById("days");

    const hoursElement =
        document.getElementById("hours");

    const minutesElement =
        document.getElementById("minutes");

    const secondsElement =
        document.getElementById("seconds");

    const messageElement =
        document.getElementById("message");



    if (difference <= 0) {


        daysElement.textContent =
            "00";

        hoursElement.textContent =
            "00";

        minutesElement.textContent =
            "00";

        secondsElement.textContent =
            "00";


        messageElement.textContent =
            "🎉 HAPPY 10TH BIRTHDAY RIVAAN! LEVEL 10 UNLOCKED! 🏆";


        return;

    }



    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const d =
        Math.floor(
            totalSeconds / 86400
        );


    const h =
        Math.floor(
            (totalSeconds % 86400)
            /
            3600
        );


    const m =
        Math.floor(
            (totalSeconds % 3600)
            /
            60
        );


    const s =
        totalSeconds % 60;



    daysElement.textContent =
        pad(d);


    hoursElement.textContent =
        pad(h);


    minutesElement.textContent =
        pad(m);


    secondsElement.textContent =
        pad(s);



    if (d === 0) {

        messageElement.textContent =
            "🔥 FINAL HOURS! LEVEL 10 ALMOST UNLOCKED!";

    }

    else if (d === 1) {

        messageElement.textContent =
            "🚀 FINAL DAY! LEVEL 10 ALMOST UNLOCKED!";

    }

    else {

        messageElement.textContent =
            "🚀 "
            +
            d
            +
            " DAYS UNTIL LEVEL 10!";

    }

}



function powerUp() {


    const confetti =
        document.getElementById(
            "confetti"
        );


    confetti.innerHTML =
        "";


    const icons = [

        "🎉",
        "⭐",
        "⚡",
        "🎮",
        "✨",
        "🏆",
        "🎂"

    ];



    for (
        let i = 0;
        i < 50;
        i++
    ) {


        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "piece";


        piece.textContent =

            icons[
                Math.floor(
                    Math.random()
                    *
                    icons.length
                )
            ];


        piece.style.left =
            Math.random()
            *
            100
            +
            "vw";


        piece.style.animationDelay =
            Math.random()
            *
            0.7
            +
            "s";


        piece.style.animationDuration =
            1.8
            +
            Math.random()
            *
            1.6
            +
            "s";


        confetti.appendChild(
            piece
        );

    }



    document
        .getElementById(
            "power"
        )
        .textContent =

        "⚡ RIVAAN +100 BIRTHDAY XP! 🏆";



    setTimeout(
        function() {

            confetti.innerHTML =
                "";

        },
        4000
    );

}



document
    .getElementById(
        "powerButton"
    )
    .addEventListener(
        "click",
        powerUp
    );



updateCountdown();


setInterval(
    updateCountdown,
    1000
);


</script>


</body>
</html>
