<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Rivaan's Birthday Countdown</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;
}

body {

    background-image:
      url("rivaan_s_level_10_birthday_bash.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    background-color: #041533;
}


/* Main countdown area */

.countdown-container {

    position: absolute;

    top: 39%;

    left: 50%;

    transform:
      translate(-50%, -50%);

    width: 82%;

    max-width: 900px;

    text-align: center;
}


/* Four boxes */

.timer {

    display: grid;

    grid-template-columns:
      repeat(4, 1fr);

    gap: 14px;
}


/* Individual countdown box */

.box {

    background:
      rgba(2, 12, 45, 0.76);

    border:
      2px solid #52eaff;

    border-radius: 18px;

    padding:
      18px 8px;

    box-shadow:

      0 0 12px #00d8ff,

      0 0 28px
      rgba(0, 102, 255, .6),

      inset
      0 0 18px
      rgba(41, 109, 255, .25);

    backdrop-filter:
      blur(5px);

    -webkit-backdrop-filter:
      blur(5px);
}


/* Number */

.number {

    color: white;

    font-size:
      clamp(42px, 7vw, 88px);

    font-weight: 1000;

    line-height: 1;

    text-shadow:

      0 0 7px #00ddff,

      0 0 18px #126cff,

      3px 3px 0 #111950;
}


/* DAYS / HOURS etc */

.label {

    margin-top: 7px;

    color: #c6f8ff;

    font-size:
      clamp(11px, 1.7vw, 18px);

    font-weight: 900;

    letter-spacing: .12em;
}


/* Message underneath */

.message {

    display: inline-block;

    margin-top: 18px;

    padding:

      10px 22px;

    border-radius:
      30px;

    color: white;

    background:
      rgba(3, 16, 55, .80);

    border:

      2px solid
      #55edff;

    font-size:

      clamp(16px, 2.3vw, 26px);

    font-weight: 900;

    box-shadow:

      0 0 16px
      rgba(0, 218, 255, .5);

    text-shadow:

      0 0 10px #00cfff;
}


/* Button */

button {

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    padding:

      12px 20px;

    font-size:

      clamp(14px, 2vw, 18px);

    font-weight: 1000;

    color: #08204a;

    background:

      linear-gradient(
        #fff66a,
        #ffb600
      );

    box-shadow:

      0 5px 0 #9a5200,

      0 0 18px
      rgba(255, 195, 0, .7);
}


button:active {

    transform:
      translateY(3px);
}


/* Power-up text */

#power {

    color:
      #fff566;

    margin-top:
      10px;

    font-weight:
      1000;

    font-size:

      clamp(16px, 2vw, 22px);

    text-shadow:

      0 0 10px #ffb700;
}


/* Confetti */

.confetti {

    position:
      fixed;

    inset:
      0;

    pointer-events:
      none;

    overflow:
      hidden;
}


.piece {

    position:
      absolute;

    top:
      -40px;

    font-size:
      25px;

    animation:
      fall 2.6s linear forwards;
}


@keyframes fall {

    to {

        transform:

          translateY(115vh)

          rotate(720deg);

        opacity:
          .9;
    }
}


/* iPad portrait */

@media
(max-width: 700px) {

    .timer {

        grid-template-columns:

          repeat(2,1fr);
    }

    .countdown-container {

        width: 88%;

        top: 48%;
    }
}

</style>

</head>


<body>


<div class="countdown-container">


<div class="timer">


<div class="box">

<div
class="number"
id="days">

00

</div>

<div class="label">

DAYS

</div>

</div>



<div class="box">

<div
class="number"
id="hours">

00

</div>

<div class="label">

HOURS

</div>

</div>



<div class="box">

<div
class="number"
id="minutes">

00

</div>

<div class="label">

MINUTES

</div>

</div>



<div class="box">

<div
class="number"
id="seconds">

00

</div>

<div class="label">

SECONDS

</div>

</div>


</div>



<div
class="message"
id="message">

Loading birthday mission...

</div>


<br>


<button
id="powerButton">

PRESS FOR POWER-UP ⚡

</button>


<div id="power"></div>


</div>



<div
class="confetti"
id="confetti">
</div>



<script>


const target =
new Date(
"2026-08-22T00:00:00-04:00"
);



function pad(value) {

return String(value)
.padStart(2,"0");

}



function updateCountdown() {


const now =
new Date();


const difference =
target.getTime()
-
now.getTime();



if (
difference <= 0
) {


days.textContent =
"00";


hours.textContent =
"00";


minutes.textContent =
"00";


seconds.textContent =
"00";


message.textContent =

"🎉 HAPPY 10TH BIRTHDAY RIVAAN! LEVEL 10 UNLOCKED! 🏆";


return;

}



const totalSeconds =
Math.floor(
difference / 1000
);



const d =
Math.floor(
totalSeconds / 86400
);



const h =
Math.floor(

(totalSeconds % 86400)

/ 3600

);



const m =
Math.floor(

(totalSeconds % 3600)

/ 60

);



const s =
totalSeconds % 60;



days.textContent =
pad(d);


hours.textContent =
pad(h);


minutes.textContent =
pad(m);


seconds.textContent =
pad(s);



if (d === 1) {

message.textContent =

"🚀 FINAL DAY! LEVEL 10 ALMOST UNLOCKED!";

}

else {

message.textContent =

"🚀 " +
d +
" DAYS UNTIL LEVEL 10!";

}


}



function powerUp() {


const confetti =

document.getElementById(
"confetti"
);


confetti.innerHTML =
"";


const icons = [

"🎉",

"⭐",

"⚡",

"🎮",

"✨",

"🏆",

"🎂"

];



for (
let i = 0;
i < 50;
i++
) {


const piece =

document.createElement(
"div"
);


piece.className =
"piece";


piece.textContent =

icons[
Math.floor(
Math.random()
*
icons.length
)
];


piece.style.left =

Math.random()
*
100
+
"vw";


piece.style.animationDelay =

Math.random()
*
0.7
+
"s";


piece.style.animationDuration =

1.8
+
Math.random()
*
1.6
+
"s";


confetti.appendChild(
piece
);

}



document
.getElementById(
"power"
)
.textContent =

"⚡ RIVAAN +100 BIRTHDAY XP! 🏆";



setTimeout(
() => {

confetti.innerHTML =
"";

},
4000
);


}



document
.getElementById(
"powerButton"
)
.addEventListener(
"click",
powerUp
);


updateCountdown();


setInterval(
updateCountdown,
1000
);


</script>


</body>
</html>
